name: BrickAndBrew
options:
  bundleIdPrefix: com.brickandbrew
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
targets:
  BrickAndBrew:
    type: application
    platform: iOS
    sources:
      - path: BrickAndBrew
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brickandbrew.app
        PRODUCT_NAME: BrickAndBrew
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        DEVELOPMENT_TEAM: DTF4NR87GG
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: BrickAndBrew/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Brick & Brew"
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_ENTITLEMENTS: BrickAndBrew/BrickAndBrew.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    entitlements:
      path: BrickAndBrew/BrickAndBrew.entitlements
      properties:
        aps-environment: production
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.brickandbrew.app
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: BrickAndBrew/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "Brick & Brew"
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Brick & Brew uses the camera so you can snap a photo of a pint for the crew board."
        STRAVA_CLIENT_ID: "280004"
        STRAVA_OAUTH_WORKER_URL: "https://brickandbrew-strava.brickandbrew.workers.dev"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.brickandbrew.app
            CFBundleURLSchemes:
              - brickandbrew
        UIAppFonts:
          - IBMPlexSans-Regular.ttf
          - IBMPlexSans-Medium.ttf
          - IBMPlexSans-Bold.ttf
    scheme:
      testTargets:
        - BrickAndBrewTests
      gatherCoverageData: true

  BrickAndBrewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BrickAndBrewTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brickandbrew.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BrickAndBrew.app/BrickAndBrew"
        BUNDLE_LOADER: "$(TEST_HOST)"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: BrickAndBrew
schemes:
  BrickAndBrew:
    build:
      targets:
        BrickAndBrew: all
        BrickAndBrewTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BrickAndBrewTests
